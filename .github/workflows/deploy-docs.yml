name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment per branch/PR
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # docmd's recommended GitHub Pages action: sets up Node, detects
      # docmd.config.json, installs deps, and builds. Outputs site-dir.
      - uses: docmd-io/deploy@v1.1
        id: build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ github.event_name == 'pull_request' && format('github-pages-pr-{0}', github.event.number) || 'github-pages' }}
          path: ${{ steps.build.outputs.site-dir }}

  # Deploy to production — only on push to main or manual trigger
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Preview — only on pull requests: verify the site builds and make it downloadable
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Summarize preview
        run: |
          echo "## docmd Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The documentation site built successfully! To preview it locally:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the **github-pages-pr-${{ github.event.number }}** artifact from this run's summary page" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the archive" >> $GITHUB_STEP_SUMMARY
          echo "3. Open \`index.html\` in your browser" >> $GITHUB_STEP_SUMMARY
